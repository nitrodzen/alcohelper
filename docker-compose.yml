services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alco-helper-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "777:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: alco-helper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-alco_helper}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-alco_helper}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
